<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" width="750" height="1000" role="img" aria-hidden="true">

  <style>
    .fov-ray { animation: btw-fov-pulse 4s ease-in-out infinite; }
    .fov-ray.d1 { animation-delay: 0s; }
    .fov-ray.d2 { animation-delay: .6s; }
    .fov-ray.d3 { animation-delay: 1.2s; }
    @keyframes btw-fov-pulse { 0%,100% { opacity: .14; } 50% { opacity: .30; } }
    .phone-pulse { transform-box: fill-box; transform-origin: center; animation: btw-phone-pulse 3s ease-in-out infinite; }
    @keyframes btw-phone-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
  </style>
  <rect id="background" x="0" y="0" width="750" height="1000" fill="#0F172A"/>
