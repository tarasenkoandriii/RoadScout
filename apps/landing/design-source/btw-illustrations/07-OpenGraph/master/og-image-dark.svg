<!-- og-image-dark.svg: intentionally identical to og-image.svg. The brief specifies exactly
     one background (#0F172A, solid, no gradients) — there is no second dark palette to diverge
     from. This file exists as an explicit, unambiguously-named asset for pipelines/CDNs that
     select variants by filename convention (mirroring the same decision already made for
     04-Hero-Illustration and 06-Privacy-Illustration). og-image-light.svg is the one genuine
     recolor in this set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-hidden="true">

  <style>
    .fov-ray { animation: og-fov-pulse 5s ease-in-out infinite; }
    @keyframes og-fov-pulse { 0%,100% { opacity: .16; } 50% { opacity: .30; } }
  </style>
  <rect id="background" x="0" y="0" width="1200" height="630" fill="#0F172A"/>
  <g id="logo-mark" transform="translate(64,94) scale(0.75)">
    <path d="M32 4 L54 12 V29 C54 45 44 55 32 60 C20 55 10 45 10 29 V12 Z" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linejoin="round"/>
    <path d="M32 24 L20 40 A16 16 0 0 1 44 40 Z" fill="#3B82F6" opacity="0.28"/>
    <circle cx="32" cy="20" r="4.6" fill="#3B82F6"/>
  </g>
  <text x="126" y="132" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="44">BTW</text>
  <text x="64" y="204" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="52">Beyond the Wall</text>
  <text x="64" y="250" fill="#F8FAFC" opacity="0.82" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="26">AI Camera Awareness</text>
  <text x="64" y="286" fill="#3B82F6" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20">Privacy-first Navigation</text>
  <path id="scan-cone" d="M838 195 L711.81 14.79 A220 220 0 0 1 964.19 14.79 Z" fill="#3B82F6" opacity="0.30"/>
  <path class="fov-ray" d="M700 130 L866.31 288.87 A230 230 0 0 1 779.84 345.7 Z" fill="#3B82F6" opacity="0.20"/>
  <path class="fov-ray" d="M1010 150 L897.96 350.86 A230 230 0 0 1 821.24 281.42 Z" fill="#3B82F6" opacity="0.20"/>
  <path class="fov-ray" d="M1060 400 L830.16 391.48 A230 230 0 0 1 857.16 291.58 Z" fill="#3B82F6" opacity="0.20"/>
  <g id="camera-1">
    <circle cx="700" cy="130" r="12" fill="#22C55E"/>
    <circle cx="700" cy="130" r="21" fill="#22C55E" opacity="0.15"/>
  </g>
  <g id="camera-2">
    <circle cx="1010" cy="150" r="12" fill="#22C55E"/>
    <circle cx="1010" cy="150" r="21" fill="#22C55E" opacity="0.15"/>
  </g>
  <g id="camera-3">
    <circle cx="1060" cy="400" r="12" fill="#EAB308"/>
    <circle cx="1060" cy="400" r="21" fill="#EAB308" opacity="0.15"/>
  </g>
  <g id="route" transform="translate(700,504) scale(3,1)" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round">
    <path d="M8 32 C30 32 26 8 50 8 C74 8 70 32 92 32"/>
    <circle cx="8" cy="32" r="3.5" fill="#F8FAFC" stroke="none"/>
    <circle cx="92" cy="32" r="3.5" fill="#F8FAFC" stroke="none"/>
  </g>
  <g id="warning" fill="none" stroke="#F8FAFC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M678 507 L693 533 H663 Z"/>
    <line x1="678" y1="517.4" x2="678" y2="523.64"/>
  </g>
  <circle cx="678" cy="528.32" r="1.3" fill="#F8FAFC"/>
  <g id="compass" transform="translate(740,215) scale(0.83)">
    <circle cx="24" cy="24" r="19" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <path d="M24 9 L28 24 L24 39 L20 24 Z" fill="#F8FAFC"/>
    <circle cx="24" cy="24" r="2.2" fill="#0F172A" stroke="#F8FAFC" stroke-width="1.5"/>
  </g>
  <g id="phone">
    <rect x="763" y="195" width="150" height="290" rx="22" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect id="screen" x="776" y="208" width="124" height="264" rx="11" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="838" cy="223" r="4" fill="#22C55E"/>
  </g>
</svg>